<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#14181f">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SurveyCAD">
<title>SurveyCAD</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--app:#14181f;--bg:#0e1218;--bar:#1a1f27;--sc:#232a34;--fg:#ece9df;--mu:#8b95a3;--ac:#4cc4d8;--pr:#f0b24a;--bd:#2c323c;--gr:#1b212a;--onac:#05262c;--cv:#0e1218;--cf:#ece9df;--cg:#1b212a;--cac:#4cc4d8;--cb:#1a1f27;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"],:root[data-theme="mixed"]{--app:#e6ebee;--bg:#ffffff;--bar:#f3f5f7;--sc:#ffffff;--fg:#1c2430;--mu:#5f6b78;--ac:#0a7ea4;--pr:#b9770e;--bd:#cfd6dd;--gr:#d9e1e6;--onac:#ffffff}
:root[data-theme="light"]{--cv:#ffffff;--cf:#1c2430;--cg:#e3e7ec;--cac:#0a7ea4;--cb:#ffffff}
:root[data-theme="mixed"]{--cv:#000000;--cf:#e8e8e8;--cg:#1d1d21;--cac:#4cc4d8;--cb:#1a1f27}
html,body{height:100%;margin:0}
body{position:relative;background:var(--app);color:var(--fg);font:11px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
.row{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--bar);border-bottom:1px solid var(--bd)}
#top{align-items:center}
#top button{flex:0 0 auto;width:36px;min-height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-color:transparent;background:transparent}
#top select{flex:1;min-width:0;min-height:30px}
#cmdrow{padding:0;background:none;border:0;flex-wrap:nowrap}
#esc,#ent{min-width:50px;min-height:34px}
#sb{display:none!important}
#zb{display:none!important}
#tools button{overflow:hidden}
#lrow{background:none;border:0;padding:0 0 8px}
#lrow #ln{flex:1 1 90px}
#tools{display:none;position:absolute;left:6px;right:52px;top:6px;max-height:calc(100% - 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bar);border:1px solid var(--bd);border-radius:12px;padding:4px 10px 10px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:5}
#tools.open{display:block}
#tools h4{margin:7px 0 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 1px;min-height:40px;font-size:10px;line-height:1.1}
#tools i{font-style:normal;font-size:16px;line-height:1}
button,select,input{font:inherit;color:var(--fg);background:var(--sc);border:1px solid var(--bd);border-radius:6px;padding:3px 7px;min-height:28px;font-size:11px}
button.on{background:var(--pr);color:#20180a;border-color:var(--pr)}
select{flex:1;min-width:80px}
#menu{display:none;position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bar);border-top:1px solid var(--bd);border-radius:14px 14px 0 0;padding:12px;z-index:20;box-shadow:0 -12px 40px -8px rgba(0,0,0,.6)}
#menu.open{display:block}
#menu label{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
#menu label b{flex:1 0 100%;font-weight:600}
#sb{display:none;position:absolute;left:6px;right:6px;bottom:34px;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bar);border:1px solid var(--bd);border-radius:10px;padding:6px;font-size:12px;z-index:4;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#sb select{flex:1 1 120px;min-width:0;min-height:30px;font-size:12px;padding:4px 6px}
#sb button{min-height:30px;padding:4px 8px;font-size:12px}
#prop{display:none;position:absolute;left:6px;right:6px;top:6px;background:var(--bar);border:1px solid var(--bd);border-radius:12px;padding:10px;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#prop.open{display:block}
#prop h4{margin:0 0 8px;font-size:12px;line-height:1.3}
#prop .r{display:flex;gap:6px;margin-bottom:8px}
#lc{width:44px;padding:2px}
#hdr{display:none;align-items:center;gap:8px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--bd)}
.brand{font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px;font-weight:700}
.brand b{color:var(--pr);margin-right:3px}
#pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 8px;font-size:12px;border-radius:6px;background:transparent}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pr);display:inline-block}
#zb{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:3px;z-index:3}
.zbtn{width:34px;min-height:34px;padding:0;font-size:17px;background:var(--bar)}
#tgs{position:absolute;right:6px;bottom:6px;display:none;gap:3px;z-index:3}
.tg{min-height:24px;padding:2px 6px;font-size:9px;font-weight:600;letter-spacing:.05em;border-radius:4px;color:var(--mu);background:var(--bar)}
.tg.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
#hint{position:absolute;left:8px;top:6px;font-size:12px;color:var(--cf);pointer-events:none;z-index:2}
#dock{position:absolute;right:6px;top:34px;display:flex;flex-direction:column;align-items:center;background:var(--bar);border:1px solid var(--bd);border-radius:12px;padding:3px;z-index:4;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#dk{display:flex;flex-direction:column;gap:2px}
#dock button{width:38px;min-height:38px;padding:0;border:none;background:transparent;font-size:19px;line-height:1;color:var(--fg)}
#dock button:active{background:var(--sc)}
#dcol{min-height:24px!important;font-size:15px!important;color:var(--mu)!important}
#strip{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:3px 0 6px}
#strip button{flex:none;display:flex;flex-direction:row;align-items:center;gap:6px;min-height:34px;padding:4px 11px;font-size:11px;border-radius:9px;border:1px solid var(--bd)}
#strip i{font-style:normal;font-size:14px;line-height:1}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px}
textarea{flex:1 1 100%;font:inherit;font-size:16px;color:var(--fg);background:var(--sc);border:1px solid var(--bd);border-radius:6px;padding:6px;box-sizing:border-box;-webkit-user-select:text;user-select:text}
#wrap{flex:1;position:relative;min-height:80px}
canvas{position:absolute;left:0;top:0;touch-action:none}
#bot{border-top:1px solid var(--bd);background:var(--bar);padding:4px 6px}
#pr{font-weight:600;margin:0 0 3px;color:var(--fg);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{font-size:10px;line-height:1.25;color:var(--mu);margin:0 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#in{flex:1;min-width:0;font-size:16px;min-height:30px;padding:2px 8px;-webkit-user-select:text;user-select:text}
</style></head><body>
<div id="hdr"><span class="brand"><b>Survey</b>CAD</span><button id="pill"><i class="dot"></i><span id="pn0"></span></button></div>
<div class="row" id="top"><button id="undo" title="Undo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button><button id="redo" title="Redo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button><button id="svp" title="Save project file"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v14H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></svg></button><button id="zf2" title="Zoom to fit"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><select id="ly"></select><button id="mb" title="Menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button><button id="tb" style="display:none">Tools</button><button id="done" style="display:none">Done</button><button id="dl2" style="display:none">Delete</button><button id="fit" style="display:none">Fit</button></div>

<div id="menu"><div class="mh"><b>Menu</b><button id="mclose">Close</button></div>
<div class="row" id="lrow"><input id="ln" type="text" placeholder="New layer name" style="flex:1 1 100px;min-width:0;font-size:16px;-webkit-user-select:text;user-select:text"><button id="addl">+ Layer</button><button id="dlay">&minus; Layer</button><input type="color" id="lc" title="Layer colour"><button id="vis">Hide</button></div>
<label><b>Projects (work saves automatically)</b><select id="pj"></select><input id="pn" type="text" placeholder="Project name" style="flex:1 1 120px;min-width:0;font-size:16px;-webkit-user-select:text;user-select:text"><button id="pnew">New</button><button id="prn">Rename</button><button id="pdel">Delete project</button></label>
<label><b>Project file: backup, or move to another phone</b><button id="psave">Save project file</button><input type="file" id="pf" accept=".json,application/json,text/plain"></label>
<label><b>Annotation settings</b><select id="ad"><option value="0">Length decimals: 0</option><option value="1">Length decimals: 1</option><option value="2" selected>Length decimals: 2</option><option value="3">Length decimals: 3</option><option value="4">Length decimals: 4</option></select><select id="aa"><option value="0">Area decimals: 0</option><option value="1">Area decimals: 1</option><option value="2" selected>Area decimals: 2</option><option value="3">Area decimals: 3</option><option value="4">Area decimals: 4</option></select><select id="au"><option value="ha">Area in hectares</option><option value="ac">Area in acres</option><option value="both" selected>Area in both</option></select><select id="as"><option value="s">Text size: small</option><option value="m" selected>Text size: medium</option><option value="l">Text size: large</option></select></label>
<label><b>Select similar by</b><select id="ss"><option value="both">Similar: same type and layer</option><option value="type">Similar: same type</option><option value="layer">Similar: same layer</option></select></label>
<label><b>Display</b><select id="thm"><option value="dark">Dark</option><option value="light">Light</option><option value="mixed">Light interface, black drawing</option></select></label>
<label><b>Units</b><select id="bu"><option value="m">Drawing units: metres</option><option value="ft">Drawing units: feet</option><option value="usft">Drawing units: US survey feet</option></select><select id="ul"><option value="m">Length in m</option><option value="km">Length in km</option><option value="ft">Length in ft</option><option value="yd">Length in yd</option><option value="mi">Length in miles</option><option value="usft">Length in US ft</option></select><select id="ua"><option value="m2">Area in m&sup2;</option><option value="ha">Area in hectares</option><option value="km2">Area in km&sup2;</option><option value="ft2">Area in ft&sup2;</option><option value="ac">Area in acres</option></select><button id="um">Metric</button><button id="ui">Imperial</button></label>
<label><b>Snap to (tap to turn on or off)</b><button data-s="a">All snaps</button><button data-s="e">Endpoint</button><button data-s="m">Midpoint</button><button data-s="c">Center</button><button data-s="q">Quadrant</button><button data-s="i">Intersection</button><button data-s="n">Nearest</button><button data-s="k">Raster corners</button><button data-s="b">Base map</button><button data-s="o">Polar</button><select id="pi"><option value="15">Polar step 15&deg;</option><option value="5">5&deg;</option><option value="10">10&deg;</option><option value="30">30&deg;</option><option value="45">45&deg;</option><option value="90">90&deg; (ortho)</option></select><button data-s="h">Show points</button><button data-s="x">Crosshair</button></label>
<label><b>Project coordinate system</b><select id="pc"></select></label>
<label><b>Import CSV (name,E,N or id,E,N; Lat/Lon = lat,lon)</b><select id="icrs"></select><select id="imode"><option value="pts">as points</option><option value="pl">as polyline</option><option value="pg">as polygon</option></select><input type="file" id="cf" accept=".csv,.txt,text/csv,text/plain"></label>
<label><b>Export CSV: choose which points</b><select id="es"><option value="all">All points</option><option value="vl">Visible layers only</option><option value="cl">Current layer only</option><option value="sel">Selected object only</option><option value="pk">Picked points only</option></select><select id="ecrs"></select><button id="epk">Pick points</button><button id="ewn">Window pick</button><button id="eclr">Clear picks</button><button id="ecsv">Save CSV</button></label>
<label><b>Add image or base map</b><input type="file" id="imf" accept="image/*"></label>
<label><b>Image and selection</b><button id="geo">Georeference</button><button id="rvis">Hide image</button><button id="del">Delete selected</button></label>
<label><b>Layer tools (name comes from the name box)</b><button id="lren">Rename</button><button id="lcol">New unique colour</button><button id="llk">Lock / unlock layer</button><button id="ldel">Delete layer</button></label>
<label><b>Map export settings (leave scale blank for automatic 1:50, 1:100, 1:150 ...)</b><input id="sc" type="text" inputmode="numeric" placeholder="Auto" style="width:90px"><select id="pp"><option value="auto">Paper: auto</option><option value="a4l">A4 landscape</option><option value="a4p">A4 portrait</option><option value="a3l">A3 landscape</option><option value="a3p">A3 portrait</option></select><select id="pa"><option value="all">Area: all objects</option><option value="view">Area: current view</option></select></label>
<label><b>Map title, information text and legend (printed on exports)</b><input id="mt" type="text" placeholder="Map title" style="flex:1 1 100%;min-width:0;font-size:16px;-webkit-user-select:text;user-select:text"><textarea id="mi" rows="2" placeholder="Information text, 2 lines shown beside the scale (e.g. Plot 133, Kampala | Surveyed by ...)"></textarea><textarea id="ml" rows="4" placeholder="Legend, one entry per line. Start a line with a colour to get a colour line, e.g.&#10;#e5484d Boundary&#10;#3e63dd Road&#10;Building"></textarea><select id="lgp"><option value="tr">Legend: top right</option><option value="tl">Legend: top left</option><option value="br">Legend: bottom right</option><option value="bl">Legend: bottom left</option><option value="none">Legend: none</option></select><button id="mlf">Fill legend from layers</button></label>
<label><b>Export map (border, north arrow, scale bar)</b><button id="png">Save image (PNG)</button><button id="pdf">Save PDF</button></label>
</div>
<div id="wrap"><canvas id="cv"></canvas>
<div id="hint">tap to place &middot; drag to pan &middot; pinch to zoom</div>
<div id="zb"><button class="zbtn" id="zi">+</button><button class="zbtn" id="zo">&minus;</button><button class="zbtn" id="zf">&#9974;</button></div>
<div id="dock"><div id="dk"><button data-g="draw" title="Draw">&#9998;</button><button data-g="mod" title="Modify">&#10021;</button><button data-g="ann" title="Annotate and measure">T</button><button data-g="sel" title="Select">&#9745;</button><button id="dlyr" title="Layers">&#8803;</button><button id="dsnap" title="Snaps">&#8982;</button><button id="dthm" title="Display: dark / light">&#9680;</button></div><button id="dcol" title="Hide toolbar">&#8964;</button></div>
<div id="tgs"><button class="tg" data-s="a">SNAP</button><button class="tg" data-s="o">POLAR</button><button class="tg" data-s="x">CROSS</button><button class="tg" data-s="h">PTS</button><button class="tg" data-s="b">MAP</button></div>
<div id="sb"><span id="sbt"></span><button id="sbp">+ Similar</button><button id="sbm">&minus; Similar</button><button id="sbq">Properties</button><button id="sbd">Delete</button><button id="sbc">Clear</button></div>
<div id="prop"><h4 id="pt">Properties</h4><div class="r" id="plrow"><select id="pl2"></select><button id="pla">Move to layer</button></div><div class="r" id="alrow" style="display:none;align-items:center"><span>Opacity</span><input type="range" id="alr" min="5" max="100" step="5" style="flex:1;min-height:30px"><span id="alv" style="min-width:42px;text-align:right"></span></div><div class="r" id="pnrow"><input id="pnn" type="text" style="flex:1;min-width:0;font-size:16px"><button id="pna">Apply text</button></div><div class="r" id="pn2row" style="display:none"><input id="pn2" type="text" placeholder="Manual area text (blank = automatic)" style="flex:1;min-width:0;font-size:16px"></div><div class="r" id="pflrow" style="display:none"><button id="pfl" style="flex:1">Flip label to the other side of the line</button></div><div class="r"><button id="pcl" style="flex:1">Close</button></div></div><div id="tools"><div class="mh"><b id="tt">Tools</b><button id="tclose">&#10005;</button></div><section data-g="draw"><h4>Draw</h4><div class="g"><button data-t="POINT"><i>✚</i>Point</button><button data-t="LINE"><i>╱</i>Line</button><button data-t="PLINE"><i>⌇</i>Polyline</button><button data-t="POLY"><i>△</i>Polygon</button><button data-t="CURVE"><i>∿</i>Curve</button><button data-t="CIRCLE"><i>○</i>Circle</button><button data-t="CIRC3"><i>◎</i>Circle 3P</button><button data-t="ARC"><i>◠</i>Arc</button></div></section><section data-g="sel"><h4>Select</h4><div class="g"><button data-t="SELM"><i>☑</i>Multi</button><button data-t="SELW"><i>▭</i>Window</button><button data-t="SSIM"><i>≈</i>Similar</button><button data-o="A"><i>▣</i>All</button><button data-o="C"><i>☐</i>Clear</button></div></section><section data-g="ann"><h4>Annotate</h4><div class="g"><button data-t="ALEN"><i>⟷</i>Length</button><button data-t="APOLY"><i>▢</i>Plot label</button><button data-t="TEXT"><i>T</i>Text</button></div></section><section data-g="ann"><h4>Measure</h4><div class="g"><button data-t="MEAS"><i>↔</i>Distance</button><button data-t="MAREA"><i>▦</i>Area</button><button data-t="MANG"><i>∠</i>Angle</button></div></section><section data-g="mod"><h4>Modify</h4><div class="g"><button data-t="MOVE"><i>✥</i>Move</button><button data-t="COPY"><i>❐</i>Copy</button><button data-t="ROT"><i>↻</i>Rotate</button><button data-t="SCALE"><i>⇲</i>Scale</button><button data-t="ALIGN"><i>⇉</i>Align</button><button data-t="TRIM"><i>✂</i>Trim</button><button data-t="EXTEND"><i>⇥</i>Extend</button><button data-t="EXTO"><i>⇤</i>To object</button><button data-t="OFFSET"><i>⫽</i>Offset</button><button data-t="JOIN"><i>⊕</i>Join</button><button data-o="z"><i>✸</i>Explode</button></div></section><section data-g="mod"><h4>Vertices</h4><div class="g"><button data-t="VMOVE"><i>◆</i>Move vtx</button><button data-t="VADD"><i>⊞</i>Add vtx</button><button data-t="VDEL"><i>⊟</i>Del vtx</button></div></section><section data-g="mod"><h4>Arrange selected</h4><div class="g"><button data-o="f"><i>⇧</i>Front</button><button data-o="u"><i>↑</i>Forward</button><button data-o="d"><i>↓</i>Backward</button><button data-o="b"><i>⇩</i>Back</button><button data-o="l"><i>≡</i>To layer</button></div></section></div></div>
<div id="bot">
<p id="st">Ready.</p>
<p id="pr">What would you like to do?</p>
<div id="strip"></div>
<div class="row" id="cmdrow"><button id="esc">Esc</button><input id="in" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="command (L PL C ?) or x,y  @dx,dy  @dist&lt;angle"><button id="pl" style="display:none">Place</button><button id="ent">Enter</button></div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
var PAL=['#e5484d','#f5a524','#30a46c','#3e63dd','#ab4aba','#12a594'];
