<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SurveyCAD">
<title>SurveyCAD</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#eef2f4;--fg:#0f2a3a;--bar:#dde5ea;--ac:#0a7ea4;--bd:#b7c5ce;--gr:#d3dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b24;--fg:#e3eef3;--bar:#162b38;--ac:#4cc3e8;--bd:#2f4b5c;--gr:#1a3342}}
:root[data-theme="dark"]{--bg:#0d1b24;--fg:#e3eef3;--bar:#162b38;--ac:#4cc3e8;--bd:#2f4b5c;--gr:#1a3342}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px -apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
.row{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--bar);border-bottom:1px solid var(--bd)}
#top button{flex:1;min-width:0;padding:6px 4px}
#tools{display:none;position:absolute;left:6px;right:6px;top:6px;max-height:calc(100% - 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bar);border:1px solid var(--bd);border-radius:12px;padding:4px 10px 10px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:5}
#tools.open{display:block}
#tools h4{margin:10px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;min-height:52px;font-size:12px;line-height:1.1}
#tools i{font-style:normal;font-size:20px;line-height:1}
button,select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 9px;min-height:34px}
button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
select{flex:1;min-width:80px}
#menu{display:none;max-height:42vh;overflow-y:auto;background:var(--bar);border-bottom:1px solid var(--bd);padding:6px}
#menu.open{display:block}
#menu label{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
#menu label b{flex:1 0 100%;font-weight:600}
#wrap{flex:1;position:relative;min-height:80px}
canvas{position:absolute;left:0;top:0;touch-action:none}
#bot{border-top:1px solid var(--bd);background:var(--bar);padding:6px}
#pr{font-weight:600;margin:0 0 4px}
#st{font-size:12px;opacity:.8;margin:0 0 6px}
#in{flex:1;min-width:0;font-size:16px;-webkit-user-select:text;user-select:text}
</style></head><body>
<div class="row" id="top"><button id="tb">Tools &#9662;</button><button id="done">Done</button><button id="undo">Undo</button><button id="dl2">Delete</button><button id="fit">Fit</button></div>
<div class="row"><select id="ly"></select><input id="ln" type="text" placeholder="New layer name" style="flex:1 1 100px;min-width:0;font-size:16px;-webkit-user-select:text;user-select:text"><button id="addl">+ Layer</button><button id="vis">Hide</button><button id="mb">Menu</button></div>
<div id="menu">
<label><b>Projects (work saves automatically)</b><select id="pj"></select><input id="pn" type="text" placeholder="Project name" style="flex:1 1 120px;min-width:0;font-size:16px;-webkit-user-select:text;user-select:text"><button id="pnew">New</button><button id="prn">Rename</button><button id="pdel">Delete project</button></label>
<label><b>Project file: backup, or move to another phone</b><button id="psave">Save project file</button><input type="file" id="pf" accept=".json,application/json,text/plain"></label>
<label><b>Units</b><select id="bu"><option value="m">Drawing units: metres</option><option value="ft">Drawing units: feet</option><option value="usft">Drawing units: US survey feet</option></select><select id="ul"><option value="m">Length in m</option><option value="km">Length in km</option><option value="ft">Length in ft</option><option value="yd">Length in yd</option><option value="mi">Length in miles</option><option value="usft">Length in US ft</option></select><select id="ua"><option value="m2">Area in m&sup2;</option><option value="ha">Area in hectares</option><option value="km2">Area in km&sup2;</option><option value="ft2">Area in ft&sup2;</option><option value="ac">Area in acres</option></select><button id="um">Metric</button><button id="ui">Imperial</button></label>
<label><b>Snap to (tap to turn on or off)</b><button data-s="e">Endpoint</button><button data-s="m">Midpoint</button><button data-s="c">Center</button><button data-s="i">Intersection</button><button data-s="n">Nearest</button><button data-s="h">Show points</button><button data-s="x">Crosshair</button></label>
<label><b>Project coordinate system</b><select id="pc"></select></label>
<label><b>Import CSV (name,E,N or id,E,N; Lat/Lon = lat,lon)</b><select id="icrs"></select><select id="imode"><option value="pts">as points</option><option value="pl">as polyline</option><option value="pg">as polygon</option></select><input type="file" id="cf" accept=".csv,.txt,text/csv,text/plain"></label>
<label><b>Export CSV: choose which points</b><select id="es"><option value="all">All points</option><option value="vl">Visible layers only</option><option value="cl">Current layer only</option><option value="sel">Selected object only</option><option value="pk">Picked points only</option></select><select id="ecrs"></select><button id="epk">Pick points</button><button id="ewn">Window pick</button><button id="eclr">Clear picks</button><button id="ecsv">Save CSV</button></label>
<label><b>Add image or base map</b><input type="file" id="imf" accept="image/*"></label>
<label><b>Image and selection</b><button id="geo">Georeference</button><button id="rvis">Hide image</button><button id="del">Delete selected</button></label>
<label><b>Layer tools (name comes from the name box)</b><button id="lren">Rename</button><button id="lcol">Next colour</button><button id="ldel">Delete layer</button></label>
<label><b>Map export settings (leave scale blank for automatic 1:50, 1:100, 1:150 ...)</b><input id="sc" type="text" inputmode="numeric" placeholder="Auto" style="width:90px"><select id="pp"><option value="auto">Paper: auto</option><option value="a4l">A4 landscape</option><option value="a4p">A4 portrait</option><option value="a3l">A3 landscape</option><option value="a3p">A3 portrait</option></select><select id="pa"><option value="all">Area: all objects</option><option value="view">Area: current view</option></select></label>
<label><b>Export map (border, north arrow, scale bar)</b><button id="png">Save image (PNG)</button><button id="pdf">Save PDF</button></label>
</div>
<div id="wrap"><canvas id="cv"></canvas><div id="tools"><h4>Draw</h4><div class="g"><button data-t="POINT"><i>✚</i>Point</button><button data-t="LINE"><i>╱</i>Line</button><button data-t="PLINE"><i>⌇</i>Polyline</button><button data-t="POLY"><i>△</i>Polygon</button><button data-t="CURVE"><i>∿</i>Curve</button><button data-t="CIRCLE"><i>○</i>Circle</button><button data-t="CIRC3"><i>◎</i>Circle 3P</button><button data-t="ARC"><i>◠</i>Arc</button></div><h4>Measure</h4><div class="g"><button data-t="MEAS"><i>↔</i>Distance</button><button data-t="MAREA"><i>▦</i>Area</button><button data-t="MANG"><i>∠</i>Angle</button></div><h4>Modify</h4><div class="g"><button data-t="MOVE"><i>✥</i>Move</button><button data-t="COPY"><i>❐</i>Copy</button><button data-t="ROT"><i>↻</i>Rotate</button><button data-t="SCALE"><i>⇲</i>Scale</button><button data-t="ALIGN"><i>⇉</i>Align</button><button data-t="TRIM"><i>✂</i>Trim</button><button data-t="EXTEND"><i>⇥</i>Extend</button><button data-t="JOIN"><i>⊕</i>Join</button><button data-o="z"><i>✸</i>Explode</button></div><h4>Vertices</h4><div class="g"><button data-t="VMOVE"><i>◆</i>Move vtx</button><button data-t="VADD"><i>⊞</i>Add vtx</button><button data-t="VDEL"><i>⊟</i>Del vtx</button></div><h4>Arrange selected</h4><div class="g"><button data-o="f"><i>⇧</i>Front</button><button data-o="u"><i>↑</i>Forward</button><button data-o="d"><i>↓</i>Backward</button><button data-o="b"><i>⇩</i>Back</button><button data-o="l"><i>≡</i>To layer</button></div></div></div>
<div id="bot">
<p id="pr">Pick a tool</p>
<p id="st">Tap the canvas or type a point: 100,200 / @10,5 / @25&lt;45. Tap an object with no tool to select it.</p>
<div class="row" style="padding:0;background:none;border:0">
<input id="in" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="x,y  @dx,dy  @dist&lt;angle  or a number">
<button id="pl" style="display:none">Place</button><button id="ent">Enter</button></div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
var PAL=['#e5484d','#f5a524','#30a46c','#3e63dd','#ab4aba','#12a594'];
var layers=[{n:'0',c:PAL[0],on:1}],cur=0,ents=[],rs=[],sel=null,v={x:0,y:0,s:10},W=0,H=0,tool=null,step=0,tmp=[],last=null,dl=null;
var DPR=window.devicePixelRatio||1;
var PR={POINT:['Point: tap a location, or type x,y (or NAME x,y)'],COPY:['Copy: base point','Copy: destination (tap more for more copies, Done to finish)'],LINE:['Line: start point','Line: next point (Done to finish)'],VMOVE:['Move vertex: tap a vertex (squares), then tap its new position'],VADD:['Add vertex: tap a line, polyline, polygon or curve where the vertex goes'],VDEL:['Delete vertex: tap a vertex to remove'],EPICK:['Pick points to export: tap points or vertices (tap again to unpick)'],EWIN:['Window pick: tap the first corner','Window pick: tap the opposite corner'],TRIM:['Trim: tap the part to remove (it is cut at the nearest crossing objects)'],EXTEND:['Extend: tap near the end of an open line or polyline'],JOIN:['Join: tap lines or open polylines, then Done'],CURVE:['Curve: first point','Curve: next point (Done to finish)'],ROT:['Rotate: base point','Rotate: angle in degrees (CCW)'],PLINE:['Polyline: first point','Polyline: next point (Done to finish)'],POLY:['Polygon: first point','Polygon: next point (Done to close)'],CIRCLE:['Circle: center point','Circle: type the radius, or tap a point on the circle'],CIRC3:['Circle 3P: first point on the circle','Circle 3P: second point','Circle 3P: third point'],ARC:['Arc: center','Arc: radius','Arc: start angle (deg CCW from east)','Arc: end angle (deg)'],MEAS:['Distance: tap the first point','Distance: tap the second point'],MAREA:['Area: tap each corner of the shape (Done to finish)'],MANG:['Angle: tap a point on the first arm','Angle: tap the vertex (the corner)','Angle: tap a point on the second arm'],MOVE:['Move: base point','Move: destination point'],SCALE:['Scale: base point','Scale: factor (e.g. 2)'],ALIGN:['Align: source point 1','Align: destination 1','Align: source point 2','Align: destination 2'],GEOREF:['Georeference: tap point 1 on the image','Point 1 real coordinates (x,y)','Tap point 2 on the image','Point 2 real coordinates (x,y)']};
var CR={loc:['Local (no CRS)']};
['WGS84','Arc 1960'].forEach(function(d){[35,36].forEach(function(z){['N','S'].forEach(function(h){CR[(d[0]=='W'?'w':'a')+z+h]=[d+' UTM '+z+h,z,h=='S'?1:0,d[0]=='W'?'w':'a']})})});
CR.ll=['Lat/Lon WGS84'];
var EW=[6378137,1/298.257223563],EA=[6378249.145,1/293.465];
function K(e){var f=e[1],n=f/(2-f),n2=n*n,n3=n2*n;return{n:n,A:e[0]/(1+n)*(1+n2/4+n2*n2/64),al:[n/2-2*n2/3+5*n3/16,13*n2/48-3*n3/5,61*n3/240],be:[n/2-2*n2/3+37*n3/96,n2/48+n3/15,17*n3/480],de:[2*n-2*n2/3-2*n3,7*n2/3-8*n3/5,56*n3/15]}}
function fwd(c,p){var k=K(c.e),r=Math.PI/180,ph=p[1]*r,dl=(p[0]-(c.z*6-183))*r,q=2*Math.sqrt(k.n)/(1+k.n),t=Math.sinh(Math.atanh(Math.sin(ph))-q*Math.atanh(q*Math.sin(ph))),x=Math.atan2(t,Math.cos(dl)),y=Math.atanh(Math.sin(dl)/Math.sqrt(1+t*t)),X=x,Y=y,j;
for(j=1;j<4;j++){X+=k.al[j-1]*Math.sin(2*j*x)*Math.cosh(2*j*y);Y+=k.al[j-1]*Math.cos(2*j*x)*Math.sinh(2*j*y)}
return[500000+.9996*k.A*Y,(c.s?1e7:0)+.9996*k.A*X]}
function inv(c,p){var k=K(c.e),r=Math.PI/180,x=(p[1]-(c.s?1e7:0))/(.9996*k.A),y=(p[0]-5e5)/(.9996*k.A),X=x,Y=y,j;
for(j=1;j<4;j++){X-=k.be[j-1]*Math.sin(2*j*x)*Math.cosh(2*j*y);Y-=k.be[j-1]*Math.cos(2*j*x)*Math.sinh(2*j*y)}
var ch=Math.asin(Math.sin(X)/Math.cosh(Y)),ph=ch;for(j=1;j<4;j++)ph+=k.de[j-1]*Math.sin(2*j*ch);
return[(c.z*6-183)+Math.atan2(Math.sinh(Y),Math.cos(X))/r,ph/r]}
function g2c(g,e){var ph=g[1]*Math.PI/180,l=g[0]*Math.PI/180,e2=e[1]*(2-e[1]),N=e[0]/Math.sqrt(1-e2*Math.sin(ph)*Math.sin(ph));return[N*Math.cos(ph)*Math.cos(l),N*Math.cos(ph)*Math.sin(l),N*(1-e2)*Math.sin(ph)]}
function c2g(c,e){var e2=e[1]*(2-e[1]),pp=Math.sqrt(c[0]*c[0]+c[1]*c[1]),ph=Math.atan2(c[2],pp*(1-e2)),N,i;for(i=0;i<6;i++){N=e[0]/Math.sqrt(1-e2*Math.sin(ph)*Math.sin(ph));ph=Math.atan2(c[2]+e2*N*Math.sin(ph),pp)}return[Math.atan2(c[1],c[0])*180/Math.PI,ph*180/Math.PI]}
function sh(g,e1,e2,d){var c=g2c(g,e1);return c2g([c[0]+d[0],c[1]+d[1],c[2]+d[2]],e2)}

function $(i){return document.getElementById(i)}
function fillCr(id,skip){var s=$(id);for(var k in CR){if(k==skip)continue;var o=document.createElement('option');o.value=k;o.textContent=CR[k][0];s.appendChild(o)}}
fillCr('pc','ll');fillCr('icrs');fillCr('ecrs');
function tf(a,b,p){if(a==b||a=='loc'||b=='loc')return p;var A=CR[a],B=CR[b],g=p;
if(a!='ll'){g=inv({e:A[3]=='a'?EA:EW,z:A[1],s:A[2]},p);if(A[3]=='a')g=sh(g,EA,EW,[-160,-8,-300])}
if(b=='ll')return g;
if(B[3]=='a')g=sh(g,EW,EA,[160,8,300]);
return fwd({e:B[3]=='a'?EA:EW,z:B[1],s:B[2]},g)}
var db=null,tm=0,pid=null,plist=[],pdc=0,hist=[],jl=[],vh=null,pnm='',xp={},wc=null,PL=0,CR2=null;
function idb(cb){try{var q=indexedDB.open('scad',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv')};q.onsuccess=function(){db=q.result;cb()};q.onerror=function(){}}catch(x){}}
function kv(m){return db.transaction('kv',m||'readonly').objectStore('kv')}
function snapP(){return{l:layers,e:ents,c:cur,pc:$('pc').value,v:v,rs:rs.map(function(r){return{src:r.src,a:r.a,b:r.b,t:r.t,on:r.on,name:r.name}})}}
function put(){if(!db||!pid)return;try{kv('readwrite').put(snapP(),'p:'+pid)}catch(x){}}
function putIdx(){try{kv('readwrite').put({cur:pid,list:plist},'idx')}catch(x){}}
function save(){try{var hj=JSON.stringify(ents);if(hj!=hist[hist.length-1]){hist.push(hj);if(hist.length>40)hist.shift()}}catch(x){}
if(!db){try{localStorage.setItem('scad2',JSON.stringify({l:layers,e:ents,c:cur,p:$('pc').value}))}catch(x){}return}clearTimeout(tm);tm=setTimeout(put,400)}
function addImg(o){var im=new Image();im.onload=draw;im.src=o.src;rs.push({img:im,src:o.src,a:o.a,b:o.b,t:o.t,on:o.on,name:o.name})}
function apply(d){layers=d.l&&d.l.length?d.l:[{n:'0',c:PAL[0],on:1}];ents=d.e||[];cur=Math.min(d.c||0,layers.length-1);$('pc').value=(CR[d.pc]&&d.pc!='ll')?d.pc:'loc';v=d.v||{x:0,y:0,s:10};rs=[];(d.rs||[]).forEach(addImg);hist=[JSON.stringify(ents)];jl=[];xp={};sel=null;last=null;setTool(null);fillLy();draw()}
function pname(){var n=plist.filter(function(x){return x.id==pid})[0];return n?n.name:''}
function fillP(){var e=$('pj');e.innerHTML='';plist.forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.name;e.appendChild(o)});e.value=pid}
function openP(id){var g=kv().get('p:'+id);g.onsuccess=function(){pid=id;apply(g.result||{});putIdx();fillP();say('Project: '+pname())}}
function newP(name,data){put();pid='p'+Date.now();plist.push({id:pid,name:name});apply(data||{});put();putIdx();fillP();say('Project: '+name)}
function boot(){var g=kv().get('idx');g.onsuccess=function(){var x=g.result;
if(x&&x.list&&x.list.length){plist=x.list;var ok=plist.filter(function(y){return y.id==x.cur}).length;openP(ok?x.cur:plist[0].id)}
else{pid='p'+Date.now();plist=[{id:pid,name:'Project 1'}];var h=kv().get('rs');h.onsuccess=function(){(h.result||[]).forEach(addImg);putIdx();put();fillP();draw()}}}}
function load(){try{var d=JSON.parse(localStorage.getItem('scad2')||'null');if(d&&d.l&&d.l.length){layers=d.l;ents=d.e||[];cur=d.c||0;if(CR[d.p])$('pc').value=d.p}}catch(x){}}
function resize(){W=wrap.clientWidth;H=wrap.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';draw()}
function S(p){return[(p[0]-v.x)*v.s+W/2,H/2-(p[1]-v.y)*v.s]}
function Wd(x,y){return[(x-W/2)/v.s+v.x,v.y-(y-H/2)/v.s]}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n)}
function dist(a,b){return Math.sqrt((a[0]-b[0])*(a[0]-b[0])+(a[1]-b[1])*(a[1]-b[1]))}
function path(e){ctx.beginPath();var p;
if(e.t=='L'){p=S(e.a);ctx.moveTo(p[0],p[1]);p=S(e.b);ctx.lineTo(p[0],p[1])}
else if(e.t=='P'){e.p.forEach(function(q,i){var s=S(q);if(i)ctx.lineTo(s[0],s[1]);else ctx.moveTo(s[0],s[1])});if(e.z)ctx.closePath()}
else if(e.t=='S'){spl(e.p).forEach(function(q,i){var s=S(q);if(i)ctx.lineTo(s[0],s[1]);else ctx.moveTo(s[0],s[1])})}
else if(e.t=='T'){p=S(e.p);ctx.moveTo(p[0]-5,p[1]);ctx.lineTo(p[0]+5,p[1]);ctx.moveTo(p[0],p[1]-5);ctx.lineTo(p[0],p[1]+5)}
else{p=S(e.c);if(e.t=='C')ctx.arc(p[0],p[1],e.r*v.s,0,6.2832);else ctx.arc(p[0],p[1],e.r*v.s,-e.s,-e.e,true)}}
function draw(){
ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=PL?'#fff':css('--bg');ctx.fillRect(0,0,W,H);
if(CR2){ctx.save();ctx.beginPath();ctx.rect(CR2[0],CR2[1],CR2[2],CR2[3]);ctx.clip()}
var s=v.s;
rs.forEach(function(r){if(!r.on)return;ctx.setTransform(DPR*s*r.a,-DPR*s*r.b,DPR*s*r.b,DPR*s*r.a,DPR*(s*(r.t[0]-v.x)+W/2),DPR*(H/2-s*(r.t[1]-v.y)));ctx.globalAlpha=.85;ctx.drawImage(r.img,0,0);ctx.globalAlpha=1});
ctx.setTransform(DPR,0,0,DPR,0,0);
if(!PL){var g=1;while(g*s<40)g*=10;
var a=Wd(0,H),b=Wd(W,0),i,p;
ctx.strokeStyle=css('--gr');ctx.lineWidth=1;ctx.beginPath();
for(i=Math.floor(a[0]/g);i<=b[0]/g;i++){p=S([i*g,0]);ctx.moveTo(p[0],0);ctx.lineTo(p[0],H)}
for(i=Math.floor(a[1]/g);i<=b[1]/g;i++){p=S([0,i*g]);ctx.moveTo(0,p[1]);ctx.lineTo(W,p[1])}
ctx.stroke();
p=S([0,0]);ctx.strokeStyle=css('--ac');ctx.beginPath();ctx.moveTo(p[0]-10,p[1]);ctx.lineTo(p[0]+10,p[1]);ctx.moveTo(p[0],p[1]-10);ctx.lineTo(p[0],p[1]+10);ctx.stroke();
ctx.fillStyle=css('--fg');ctx.font='11px sans-serif';ctx.fillText('grid '+g+' units',6,H-6)}
ents.forEach(function(e,k){var L=layers[e.l];if(!L||!L.on)return;
var on=(sel&&!sel.r&&sel.i==k)||jl.indexOf(k)>=0;ctx.strokeStyle=on?css('--ac'):L.c;ctx.lineWidth=on?4:2;path(e);ctx.stroke();
